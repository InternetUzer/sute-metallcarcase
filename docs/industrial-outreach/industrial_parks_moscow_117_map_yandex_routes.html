function popup(p){const maps=yandexSearch(p),route=yandexRoute(p);return `<b>${esc(p.name)}</b><div class="muted">${esc(p.id)} · ${esc(p.category)}</div><p><b>Адрес:</b> ${esc(p.address)}</p><div><b>Стадия:</b> ${esc(p.stage)}<br><b>Земля:</b> ${p.area==null?'не указана':p.area+' га'}<br><b>Здания:</b> ${p.buildings_m2==null?'не указаны':p.buildings_m2.toLocaleString('ru-RU')+' м²'}<br><b>До центра:</b> ${p.radius_km??'—'} км (ориентир)<br><b>Точность:</b> ${esc(p.accuracy)}</div><div class="actions">${route?'<a href="'+esc(route)+'" target="_blank" rel="noopener noreferrer">Маршрут к ориентиру ↗</a>':''}<a href="${esc(maps)}" target="_blank" rel="noopener noreferrer">Найти парк по адресу ↗</a>${p.source?'<a href="'+esc(p.source)+'" target="_blank" rel="noopener">Источник</a>':''}</div><p class="note">${esc(p.note)}</p>`}
function filter(){const q=document.getElementById('search').value.toLocaleLowerCase('ru-RU').trim(),fit=document.getElementById('fit').value,z=document.getElementById('zone').value,c=document.getElementById('category').value,s=document.getElementById('stage').value,r=document.getElementById('radius').value;return parks.filter(p=>(!fit||(p.focus_rank||'').startsWith(fit))&&(!q||[p.id,p.name,p.address,p.category].join(' ').toLocaleLowerCase('ru-RU').includes(q))&&(!z||p.zone===z)&&(!c||group(p)===c)&&(!s||(p.stage||'').toLowerCase().includes(s.toLowerCase()))&&(!r||rgroup(p)===r));}
function render(){const chosen=filter();layer.clearLayers();markers.clear();const root=document.getElementById('list');root.replaceChildren();let displayed=0;chosen.forEach(p=>{const el=document.createElement('article');el.className='item';el.style.borderLeftColor=colors[p.zone]||'#567';const area=p.area==null?'площадь не указана':p.area+' га';el.innerHTML=`<b>${esc(p.id)} · ${esc(p.name)}</b><div class="muted">${esc(p.address)}</div><span class="tag">${esc(p.category)}</span><span class="tag">${esc(p.focus_rank)}</span><span class="tag ${group(p)==='planning'?'planned':''}">${esc(p.stage)}</span><span class="tag ${rgroup(p)==='outside'?'far':''}">${esc(area)} · ${p.radius_km??'нет'} км</span><div class="actions">${yandexRoute(p)?'<a href="'+esc(yandexRoute(p))+'" target="_blank" rel="noopener noreferrer">Маршрут к ориентиру ↗</a>':''}<a href="${esc(yandexSearch(p))}" target="_blank" rel="noopener noreferrer">Яндекс Карты: адрес ↗</a></div>`;root.appendChild(el);let marker;if(p.lat!=null&&p.lon!=null){displayed++;const icon=L.divIcon({className:'',html:`<div class="marker ${p.accuracy?.includes('Ориентир')||p.accuracy?.includes('ориентир')?'prelim':''}" style="background:${colors[p.zone]}"></div>`,iconSize:[20,20],iconAnchor:[10,10]});marker=L.marker([p.lat,p.lon],{icon}).bindPopup(popup(p));marker.addTo(layer);markers.set(p.id,marker);el.onclick=(event)=>{if(event.target.closest('a'))return;map.setView([p.lat,p.lon],11);marker.openPopup();el.classList.add('sel')};}else{el.onclick=(event)=>{if(event.target.closest('a'))return;el.classList.add('sel');alert('Точная геопозиция этого кандидата ещё не определена. Используйте адрес в списке и источник.')};}});document.getElementById('shown').textContent=`Показано ${chosen.length} объектов · ${displayed} ориентиров на карте`}
for(const name of ['search','fit','zone','category','stage','radius'])document.getElementById(name).addEventListener(name==='search'?'input':'change',render);render();
</script></body></html>
